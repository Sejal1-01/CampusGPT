[project]
name = "campusgpt"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "ddgs>=9.16.1",
    "faker>=40.54.0",
    "fastapi>=0.162.5",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "mysql-connector-python>=26.10.0",
    "pydantic>=2.14.3",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sqlglot>=30.31.0",
    "strands-agents-tools>=0.9.0",
    "strands-agents[gemini]>=1.64.0",
    "tavily-python>=0.8.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "python-docx>=1.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
